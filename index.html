<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PolSci Analytics – Network & Sentiment</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#5d6881;--pri:#1f4e9c;--pri2:#e8eefb;--bd:#d9dfec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2133;--tx:#e8ecf6;--mut:#9aa5c0;--pri:#6c9bff;--pri2:#22304f;--bd:#2b3552;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141f;--card:#1a2133;--tx:#e8ecf6;--mut:#9aa5c0;--pri:#6c9bff;--pri2:#22304f;--bd:#2b3552;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:1.5rem;margin:0}h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--mut)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h2{font-size:1.05rem;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:9px}
button:hover{background:var(--pri2)}
button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.go{background:#188a4f;border-color:#188a4f;color:#fff;font-weight:700}
button.rs{background:#c0392b;border-color:#c0392b;color:#fff}
input[type=file]{font:inherit;color:var(--tx);max-width:100%}
.hint{color:var(--mut);font-size:.88rem;margin-top:6px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:var(--pri2);position:sticky;top:0}
.note{background:var(--pri2);border-left:4px solid var(--pri);padding:10px 14px;margin:10px 0 18px;border-radius:6px;font-size:.93rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.cc{background:#fff;color:#222;border:1px solid var(--bd);border-radius:12px;padding:10px}
.cc h4{margin:0 0 6px;font-size:.92rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.cc h4 button{font-size:.75rem;padding:3px 8px;color:#222;background:#f1f3f9}
.cv{position:relative;height:330px;overflow:hidden}
.cv canvas{width:100%!important;height:100%!important;display:block}
.msg{color:var(--mut);font-size:.92rem}
.hide{display:none}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1><span data-i="title"></span><small data-i="sub"></small></h1>
 <div class="row"><span data-i="lang"></span>
  <button id="bTH" class="on">ไทย</button><button id="bEN">English</button></div>
</header>

<div class="sec"><h2>1. <span data-i="s1"></span></h2>
 <div class="row"><button id="mNet" class="on" data-i="net"></button><button id="mSen" data-i="sen"></button></div>
 <div class="hint" id="fmt"></div></div>

<div class="sec"><h2>2. <span data-i="s2"></span></h2>
 <div class="row"><input type="file" id="file" accept=".xlsx,.xls,.csv">
  <button id="bSample" data-i="sample"></button>
  <button id="bDlSample" data-i="dlsample"></button></div>
 <div class="hint" id="fstat"></div>
 <div id="lexbox" class="hide" style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--bd)">
  <div class="row"><b data-i="lexT"></b><input type="file" id="lexfile" accept=".xlsx,.xls,.csv">
   <button id="bDlLex" data-i="dllex"></button>
   <label><input type="checkbox" id="lexRep"> <span data-i="lexRep"></span></label></div>
  <div class="hint" data-i="lexHint"></div><div class="hint" id="lexstat"></div></div></div>

<div class="sec"><h2>3. <span data-i="s3"></span></h2>
 <div class="row"><button class="go" id="bRun" data-i="run"></button>
 <button class="rs" id="bReset" data-i="reset"></button></div>
 <div class="msg" id="status"></div></div>

<div id="out" class="hide">
 <div class="sec"><h2>4. <span data-i="s4"></span></h2>
  <div class="row" style="margin-bottom:10px"><button id="bDlTab" data-i="dltab"></button></div>
  <div id="tables"></div></div>
 <div class="sec"><h2>5. <span data-i="s5"></span></h2>
  <div class="row" style="margin-bottom:10px"><button id="bShowCh" class="on" data-i="showch"></button>
   <button id="bDlAll" data-i="dlall"></button></div>
  <div id="charts" class="grid"></div></div>
</div>
<div class="hint" style="text-align:center;margin:20px 0" data-i="foot"></div>
</div>

/* ---------- Network ---------- */
function network(rows){
 const ks=Object.keys(rows[0]||{});if(ks.length<2)throw 0;
 const ka=pick(ks,['source','from','ต้นทาง'],0),kb=pick(ks,['target','to','ปลายทาง'],1),kw=pick(ks,['weight','น้ำหนัก'],2);
 const ids=[],ix={};const id=s=>{s=String(s).trim();if(!(s in ix)){ix[s]=ids.length;ids.push(s)}return ix[s]};
 const E=[];rows.forEach(r=>{if(r[ka]===''||r[kb]==='')return;const w=parseFloat(r[kw]);E.push([id(r[ka]),id(r[kb]),isNaN(w)?1:w])});
 const n=ids.length;if(n<2)throw 0;
 const adj=Array.from({length:n},()=>new Set()),ind=Array(n).fill(0),outd=Array(n).fill(0),wd=Array(n).fill(0),dir=new Set();let tw=0;
 E.forEach(([a,b,w])=>{outd[a]++;ind[b]++;wd[a]+=w;wd[b]+=w;tw+=w;dir.add(a+'_'+b);if(a!==b){adj[a].add(b);adj[b].add(a)}});
 const deg=adj.map(s=>s.size),m=deg.reduce((a,b)=>a+b,0)/2;
 const bc=Array(n).fill(0),clo=Array(n).fill(0);let diam=0,ps=0,pc=0;
 for(let s=0;s<n;s++){const S=[],P=Array.from({length:n},()=>[]),sg=Array(n).fill(0),d=Array(n).fill(-1);sg[s]=1;d[s]=0;const Q=[s];
  while(Q.length){const v=Q.shift();S.push(v);adj[v].forEach(w=>{if(d[w]<0){d[w]=d[v]+1;Q.push(w)}if(d[w]===d[v]+1){sg[w]+=sg[v];P[w].push(v)}})}
  const dl2=Array(n).fill(0);let sum=0;S.slice().reverse().forEach(w=>{P[w].forEach(v=>dl2[v]+=sg[v]/sg[w]*(1+dl2[w]));if(w!==s)bc[w]+=dl2[w]});
  S.forEach(v=>{if(v!==s){sum+=d[v];ps+=d[v];pc++;diam=Math.max(diam,d[v])}});
  clo[s]=sum>0?((S.length-1)/(n-1))*((S.length-1)/sum):0;}
 const bcn=bc.map(x=>n>2?x/((n-1)*(n-2)):0);
 let x=Array(n).fill(1);for(let it=0;it<200;it++){const y=x.map((v,i)=>v+[...adj[i]].reduce((a,j)=>a+x[j],0));const nr=Math.sqrt(y.reduce((a,b)=>a+b*b,0))||1;x=y.map(v=>v/nr)}
 const cl=adj.map((s,v)=>{const nb=[...s],k=nb.length;if(k<2)return 0;let l=0;for(let i=0;i<k;i++)for(let j=i+1;j<k;j++)if(adj[nb[i]].has(nb[j]))l++;return 2*l/(k*(k-1))});
 let lab=[...Array(n).keys()];for(let it=0;it<30;it++){let ch=false;for(let v=0;v<n;v++){const c={};adj[v].forEach(u=>c[lab[u]]=(c[lab[u]]||0)+1);let best=lab[v],bv=-1;Object.keys(c).map(Number).sort((a,b)=>a-b).forEach(k=>{if(c[k]>bv){bv=c[k];best=k}});if(best!==lab[v]){lab[v]=best;ch=true}}if(!ch)break}
 const map={};let K=0;lab=lab.map(l=>{if(!(l in map))map[l]=++K;return map[l]});
 let Q=0;for(let c=1;c<=K;c++){let e=0,dc=0;for(let v=0;v<n;v++)if(lab[v]===c){dc+=deg[v];adj[v].forEach(u=>{if(lab[u]===c)e++})}Q+=e/2/m-Math.pow(dc/(2*m),2)}
 const seen=Array(n).fill(false);let cc=0;for(let s=0;s<n;s++)if(!seen[s]){cc++;const st=[s];seen[s]=true;while(st.length){const v=st.pop();adj[v].forEach(u=>{if(!seen[u]){seen[u]=true;st.push(u)}})}}
 let rec=0;E.forEach(([a,b])=>{if(dir.has(b+'_'+a))rec++});
 let pr=Array(n).fill(1/n);const os=Array(n).fill(0);E.forEach(([a,b,w])=>os[a]+=w);for(let it=0;it<100;it++){const np=Array(n).fill(0);let dg=0;for(let i=0;i<n;i++)if(!os[i])dg+=pr[i];E.forEach(([a,b,w])=>np[b]+=pr[a]*w/os[a]);pr=np.map(v=>.15/n+.85*(v+dg/n))}
 const nodes=ids.map((name,i)=>({name,pr:pr[i],deg:deg[i],ind:ind[i],outd:outd[i],wd:f3(wd[i]),btw:bcn[i],clo:clo[i],eig:x[i],clu:cl[i],com:lab[i]}));
 return{nodes,n,m,d:2*m/(n*(n-1)),ad:2*m/n,ac:cl.reduce((a,b)=>a+b,0)/n,cc,dm:diam,ap:pc?ps/pc:0,k:K,q:Q,r:E.length?rec/E.length:0,tw,adj,E,lab};
}
function drawGraph(R,dr){
 const o=card(dr?t('c_dg'):t('c_graph'));const cv=o.cv,W=cv.parentElement.clientWidth||560,H=330;cv.width=W*2;cv.height=H*2;const g=cv.getContext('2d');g.scale(2,2);
 const N=R.nodes.length,P=R.nodes.map((_,i)=>({x:W/2+Math.cos(i/N*6.28)*W/3,y:H/2+Math.sin(i/N*6.28)*H/3,vx:0,vy:0}));
 const L=[];R.adj.forEach((s,a)=>s.forEach(b=>{if(a<b)L.push([a,b])}));
 for(let it=0;it<400;it++){const cool=1-it/400;
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){let dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d2=dx*dx+dy*dy+.01,f=1800/d2,d=Math.sqrt(d2);P[i].vx+=dx/d*f;P[i].vy+=dy/d*f;P[j].vx-=dx/d*f;P[j].vy-=dy/d*f}
  L.forEach(([a,b])=>{let dx=P[b].x-P[a].x,dy=P[b].y-P[a].y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-70)*.02;P[a].vx+=dx/d*f;P[a].vy+=dy/d*f;P[b].vx-=dx/d*f;P[b].vy-=dy/d*f});
  P.forEach(p=>{p.vx+=(W/2-p.x)*.005;p.vy+=(H/2-p.y)*.005;p.x+=Math.max(-8,Math.min(8,p.vx))*cool;p.y+=Math.max(-8,Math.min(8,p.vy))*cool;p.vx*=.6;p.vy*=.6;p.x=Math.max(30,Math.min(W-30,p.x));p.y=Math.max(18,Math.min(H-18,p.y))})}
 g.fillStyle='#fff';g.fillRect(0,0,W,H);g.strokeStyle='rgba(100,110,130,.45)';
 const md=Math.max(...R.nodes.map(x=>dr?x.ind:x.deg))||1,rad=i=>5+(dr?R.nodes[i].ind:R.nodes[i].deg)/md*11;
 if(!dr)L.forEach(([a,b])=>{g.beginPath();g.moveTo(P[a].x,P[a].y);g.lineTo(P[b].x,P[b].y);g.stroke()});else{const se={};R.E.forEach(([a,b])=>{if(a!==b)se[a+'_'+b]=1});Object.keys(se).forEach(k=>{const[a,b]=k.split('_').map(Number);const dx=P[b].x-P[a].x,dy=P[b].y-P[a].y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,x1=P[a].x+ux*rad(a),y1=P[a].y+uy*rad(a),x2=P[b].x-ux*(rad(b)+2),y2=P[b].y-uy*(rad(b)+2);g.strokeStyle='rgba(80,90,120,.55)';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.fillStyle='rgba(80,90,120,.85)';g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-ux*8-uy*4,y2-uy*8+ux*4);g.lineTo(x2-ux*8+uy*4,y2-uy*8-ux*4);g.fill()})}
 g.font="11px Sarabun,sans-serif";g.textAlign='center';
 R.nodes.forEach((nd,i)=>{const r=rad(i);g.fillStyle=PAL[(nd.com-1)%PAL.length];g.beginPath();g.arc(P[i].x,P[i].y,r,0,7);g.fill();g.strokeStyle='#fff';g.stroke();g.fillStyle='#222';g.fillText(nd.name,P[i].x,P[i].y-r-3)});
 charts.push(o);
}
function drawHeat(R){
 const o=card(t('c_heat'));const cv=o.cv,W=cv.parentElement.clientWidth||560,H=330;cv.width=W*2;cv.height=H*2;const g=cv.getContext('2d');g.scale(2,2);g.fillStyle='#fff';g.fillRect(0,0,W,H);
 const idx=R.nodes.map((v,i)=>i).sort((a,b)=>R.nodes[b].deg-R.nodes[a].deg).slice(0,20).sort((a,b)=>R.nodes[a].com-R.nodes[b].com);
 const k=idx.length,pos={};idx.forEach((v,i)=>pos[v]=i);const M=Array.from({length:k},()=>Array(k).fill(0));let mx=0;
 R.E.forEach(([a,b,w])=>{if(a in pos&&b in pos){M[pos[a]][pos[b]]+=w;mx=Math.max(mx,M[pos[a]][pos[b]])}});
 const L0=78,T0=74,cs=Math.min((W-L0-8)/k,(H-T0-8)/k);g.font='10px Sarabun,sans-serif';
 idx.forEach((v,i)=>{g.fillStyle='#222';g.textAlign='right';g.fillText(R.nodes[v].name.slice(0,13),L0-4,T0+i*cs+cs/2+3);g.save();g.translate(L0+i*cs+cs/2,T0-4);g.rotate(-Math.PI/3);g.textAlign='left';g.fillText(R.nodes[v].name.slice(0,13),0,0);g.restore()});
 for(let i=0;i<k;i++)for(let j=0;j<k;j++){const a=M[i][j]/(mx||1);g.fillStyle=a?`rgba(31,78,156,${.15+.85*a})`:'#f1f3f9';g.fillRect(L0+j*cs,T0+i*cs,cs-1,cs-1)}
 charts.push(o);
}
function doNetwork(rows){

 const G=[['g_n',R.n,'m_n'],['g_m',R.m,'m_m'],['g_d',f3(R.d),'m_d'],['g_ad',f3(R.ad),'m_ad'],['g_c',f3(R.ac),'m_c'],['g_cc',R.cc,'m_cc'],['g_dm',R.dm,'m_dm'],['g_ap',f3(R.ap),'m_ap'],['g_k',R.k,'m_k'],['g_q',f3(R.q),'m_q'],['g_r',f3(R.r),'m_r'],['g_w',f3(R.tw),'m_w']];

 bar(t('c_deg'),topN(nd,'deg'),'deg',PAL[0],t('deg'));

 const mx=Math.max(...nd.map(v=>v.deg)),hist=Array(mx+1).fill(0);nd.forEach(v=>hist[v.deg]++);
 mk(t('c_hist'),'bar',{labels:hist.map((_,i)=>i),datasets:[{label:t('n'),data:hist,backgroundColor:PAL[3]}]},{xt:t('deg'),yt:t('n')});
 mk(t('c_sc'),'scatter',{datasets:[{label:t('node'),data:nd.map(v=>({x:v.deg,y:f3(v.btw)})),backgroundColor:PAL[0],pointRadius:6}]},{xt:t('deg'),yt:t('btw')});
 const t5=topN(nd,'deg',5),M=['deg','btw','clo','eig','clu'],mxs=M.map(k=>Math.max(...nd.map(v=>v[k]))||1);
 mk(t('c_rad'),'radar',{labels:M.map(k=>t(k)),datasets:t5.map((v,i)=>({label:v.name,data:M.map((k,j)=>f3(v[k]/mxs[j])),borderColor:PAL[i],backgroundColor:PAL[i]+'22'}))});

/* ---------- Sentiment ---------- */
let RX,CUR=LEX,custom={pos:[],neg:[]},lexRep=false;
function buildRX(){CUR=lexRep&&(custom.pos.length||custom.neg.length)?custom:{pos:[...new Set([...LEX.pos,...custom.pos])],neg:[...new Set([...LEX.neg,...custom.neg])]};
 const W=[...CUR.pos.map(w=>[w,1]),...CUR.neg.map(w=>[w,-1])].sort((a,b)=>b[0].length-a[0].length);
 RX=W.map(([w,s])=>/[a-z]/i.test(w)?[w,s,new RegExp('\\b'+w.replace(/[.*+?^$()|[\]\\{}]/g,'\\$&')+'\\w*','gi')]:[w,s,null]);}
buildRX();
const POSV=['pos','positive','บวก','+','1'],NEGV=['neg','negative','ลบ','-','-1'];
$('lexfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});const rs=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});const ks=Object.keys(rs[0]||{});
  const kw=pick(ks,['word','คำ'],0),kt=pick(ks,['type','polarity','ประเภท'],1),c={pos:[],neg:[]};
  rs.forEach(x=>{const w=String(x[kw]).trim().toLowerCase(),ty=String(x[kt]).trim().toLowerCase();if(!w)return;if(POSV.includes(ty))c.pos.push(w);else if(NEGV.includes(ty))c.neg.push(w)});
  if(!c.pos.length&&!c.neg.length)throw 0;custom=c;buildRX();$('lexstat').textContent=t('lexOk')+c.pos.length+' / '+c.neg.length;}
  catch(x){$('lexstat').textContent=t('lexErr')}};r.readAsArrayBuffer(f)};
$('lexRep').onchange=e=>{lexRep=e.target.checked;buildRX()};
$('bDlLex').onclick=()=>{const L=[['Word','Type'],['รายได้เพิ่มขึ้น','pos'],['การจ้างงาน','pos'],['สวัสดิการ','pos'],['ส่งออกขยายตัว','pos'],['ความเชื่อมั่นนักลงทุน','pos'],['เศรษฐกิจฟื้น','pos'],['subsidy','pos'],['investment','pos'],['trade deal','pos'],['ภาษีสูง','neg'],['ขาดแคลน','neg'],['ราคาแพง','neg'],['ปิดกิจการ','neg'],['ค่าครองชีพสูง','neg'],['ตกงาน','neg'],['tariff','neg'],['layoff','neg'],['boycott','neg']];
 const I=[['Column','Description (EN)','คำอธิบาย (TH)'],['Word','Word or phrase to match (Thai: substring match; English: word stem match, case-insensitive)','คำหรือวลีที่ต้องการจับ (ไทย: จับแบบข้อความย่อย, อังกฤษ: จับรากคำ ไม่สนตัวพิมพ์เล็กใหญ่)'],['Type','pos / positive / บวก / + / 1 = positive; neg / negative / ลบ / - / -1 = negative','pos / positive / บวก / + / 1 = เชิงบวก; neg / negative / ลบ / - / -1 = เชิงลบ'],['Tip','Longer phrases are matched first, so a phrase such as ไม่พอใจ is not counted as พอใจ','วลียาวจะถูกจับก่อน เช่น ไม่พอใจ จะไม่ถูกนับเป็น พอใจ']];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(L),'Lexicon');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(I),'Instructions');dl(xlsxBlob(wb),'sample_lexicon.xlsx');};
function scoreText(txt){let s=' '+String(txt).toLowerCase()+' ',p=0,n=0;const hit={};
 RX.forEach(([w,sg,rx])=>{let c=0;if(rx){s=s.replace(rx,()=>{c++;return ' '})}else{let i;while((i=s.indexOf(w))>=0){c++;s=s.slice(0,i)+' '+s.slice(i+w.length)}}
  if(c){hit[w]=(hit[w]||0)+c;if(sg>0)p+=c;else n+=c}});
 const sc=p+n?(p-n)/(p+n):0;return{p,n,sc,hit,lb:sc>.05?1:sc<-.05?-1:0}}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const med=a=>{const s=[...a].sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
function doSentiment(rows){
 const ks=Object.keys(rows[0]||{});if(!ks.length)throw 0;
 const kt=pick(ks,['text','ข้อความ','comment'],0),ka=ks.length>1?pick(ks,['actor','source','ผู้พูด','กลุ่ม'],1):null,kd=ks.length>2?pick(ks,['date','วันที่'],2):null;
 const D=rows.filter(r=>String(r[kt]).trim()!=='').map(r=>{const x=scoreText(r[kt]);let dt=r[kd];if(dt instanceof Date)dt=dt.toISOString().slice(0,7);return{...x,text:String(r[kt]),actor:ka&&r[ka]!==''?String(r[ka]):'-',date:kd&&dt!==''&&dt!==undefined?String(dt):''}});
 if(!D.length)throw 0;
 const sc=D.map(d=>d.sc),N=D.length,cnt=l=>D.filter(d=>d.lb===l).length,pp=cnt(1)/N*100,pg=cnt(-1)/N*100;
 const S=[['s_n',N],['s_p',cnt(1)],['s_u',cnt(0)],['s_g',cnt(-1)],['s_pp',f3(pp)],['s_pg',f3(pg)],['s_m',f3(mean(sc))],['s_md',f3(med(sc))],['s_sd',f3(sd(sc))],['s_mn',f3(Math.min(...sc))],['s_mx',f3(Math.max(...sc))]];
 tables.push({name:t('tS'),head:[t('metric'),t('value')],body:S.map(r=>[t(r[0]),r[1]]),note:t('exS')({n:N,m:mean(sc),pp,pg,sd:sd(sc)})});
 const grp=(key)=>{const g={};D.forEach(d=>(g[d[key]]=g[d[key]]||[]).push(d));return Object.entries(g).map(([k,v])=>({name:k,n:v.length,m:mean(v.map(d=>d.sc)),sd:sd(v.map(d=>d.sc)),pos:v.filter(d=>d.lb>0).length,neu:v.filter(d=>d.lb===0).length,neg:v.filter(d=>d.lb<0).length}))};
 const hd=[t('n'),t('s_m'),t('s_sd'),t('s_p'),t('s_u'),t('s_g'),t('s_pp'),t('s_pg')];
 const row=a=>[a.n,f3(a.m),f3(a.sd),a.pos,a.neu,a.neg,f3(a.pos/a.n*100),f3(a.neg/a.n*100)];
 const A=grp('actor').sort((a,b)=>b.m-a.m);
 tables.push({name:t('tA'),head:[t('actor'),...hd],body:A.map(a=>[a.name,...row(a)]),note:t('exA')({hi:A[0].name,lo:A[A.length-1].name})});
 const TM=D.some(d=>d.date)?grp('date').filter(x=>x.name!=='').sort((a,b)=>a.name.localeCompare(b.name)):[];
 if(TM.length)tables.push({name:t('tT'),head:[t('time'),...hd],body:TM.map(a=>[a.name,...row(a)]),note:t('exT')});
 const wc={};D.forEach(d=>Object.entries(d.hit).forEach(([w,c])=>wc[w]=(wc[w]||0)+c));
 const WL=Object.entries(wc).map(([w,c])=>({name:w,c,pos:CUR.pos.includes(w)})).sort((a,b)=>b.c-a.c);
 tables.push({name:t('tW'),head:[t('word'),t('type'),t('freq')],body:WL.map(w=>[w.name,w.pos?t('pos'):t('neg'),w.c]),note:t('exW')});
 tables.push({name:t('tD'),head:[t('text'),t('actor'),t('pos'),t('neg'),t('score'),t('label')],body:D.map(d=>[d.text.slice(0,90),d.actor,d.p,d.n,f3(d.sc),d.lb>0?t('s_p'):d.lb<0?t('s_g'):t('s_u')]),note:t('exD')});
 tables.forEach(renderTable);
 const C=['#188a4f','#9aa5b8','#c0392b'];
 mk(t('c_pie'),'pie',{labels:[t('s_p'),t('s_u'),t('s_g')],datasets:[{data:[cnt(1),cnt(0),cnt(-1)],backgroundColor:C}]});
 const bins=[-1,-.75,-.5,-.25,0,.25,.5,.75,1],h=Array(8).fill(0);sc.forEach(s=>{h[Math.min(7,Math.max(0,Math.floor((s+1)/.25)))]++});
 mk(t('c_sh'),'bar',{labels:bins.slice(0,8).map((b,i)=>b+' – '+bins[i+1]),datasets:[{label:t('n'),data:h,backgroundColor:h.map((_,i)=>i<3?C[2]:i<5?C[1]:C[0])}]},{xt:t('score'),yt:t('n')});
 mk(t('c_am'),'bar',{labels:A.map(a=>a.name),datasets:[{label:t('s_m'),data:A.map(a=>f3(a.m)),backgroundColor:A.map(a=>a.m>=0?C[0]:C[2])}]});
 mk(t('c_st'),'bar',{labels:A.map(a=>a.name),datasets:[{label:t('s_p'),data:A.map(a=>a.pos),backgroundColor:C[0]},{label:t('s_u'),data:A.map(a=>a.neu),backgroundColor:C[1]},{label:t('s_g'),data:A.map(a=>a.neg),backgroundColor:C[2]}]},{stack:true});
 if(TM.length>1)mk(t('c_ln'),'line',{labels:TM.map(a=>a.name),datasets:[{label:t('s_m'),data:TM.map(a=>f3(a.m)),borderColor:PAL[0],backgroundColor:PAL[0]+'33',fill:true,tension:.3}]});
 const wp=WL.filter(w=>w.pos).slice(0,12),wn=WL.filter(w=>!w.pos).slice(0,12);
 if(wp.length)mk(t('c_wp'),'bar',{labels:wp.map(w=>w.name),datasets:[{label:t('freq'),data:wp.map(w=>w.c),backgroundColor:C[0]}]},{h:true});
 if(wn.length)mk(t('c_wn'),'bar',{labels:wn.map(w=>w.name),datasets:[{label:t('freq'),data:wn.map(w=>w.c),backgroundColor:C[2]}]},{h:true});
 mk(t('c_ss'),'scatter',{datasets:[{label:t('text'),data:D.map(d=>({x:d.p,y:d.n})),backgroundColor:PAL[1],pointRadius:6}]},{xt:t('pos'),yt:t('neg')});
 mk(t('c_ad'),'doughnut',{labels:A.map(a=>a.name),datasets:[{data:A.map(a=>a.n),backgroundColor:PAL}]});
}

/* ---------- run ---------- */
function run(){
 if(!data||!data.length){$('status').textContent=t('nofile');return}
 killCharts();tables=[];$('tables').innerHTML='';$('charts').innerHTML='';
 try{method==='network'?doNetwork(data):doSentiment(data);$('out').classList.remove('hide');$('status').textContent=t('done');
  if(!window._scrolled){window._scrolled=1}$('out').scrollIntoView({behavior:'smooth'});}
 catch(e){console.error(e);$('status').textContent=t('err');$('out').classList.add('hide')}
}
